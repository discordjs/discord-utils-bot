version: '3'

services:
  application:
    build:
      context: ./
      dockerfile: dev.Dockerfile
    restart: always
    env_file:
      - ./.env
      - ./.dev.env
    ports:
      - '127.0.0.1:49202:49666'
    volumes:
      - type: bind
        source: ./tags
        target: /usr/slash-utils/tags
